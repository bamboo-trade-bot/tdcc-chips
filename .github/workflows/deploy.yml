name: 抓取並發佈集保籌碼頁面

# 排程時間為 UTC；台北時間 = UTC + 8。
# 集保股權分散表的資料日期是每週最後一個營業日（通常是週五），
# 隔週的週五／週六才會發布，所以週六晚上抓、週日早上再補一次。
# 已經有的週不會重複寫入，第二次通常直接跳過。
on:
  schedule:
    - cron: "0 12 * * 6"   # 週六 20:00 台北
    - cron: "0 1 * * 0"    # 週日 09:00 台北（補抓）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 要把新的一週 CSV commit 回 repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 排程只需要 requests：週資料直接壓成 CSV，不經過 SQLite 或 pandas
      - name: 安裝相依
        run: pip install requests

      - name: 抓取 TDCC 最新一週
        if: github.event_name != 'push'
        run: python build_static.py --fetch --no-build

      # 族群可能在網站上被改過（存在 Cloudflare KV），拉回來讓 repo 跟雲端一致。
      # 沒設定 worker_url 或連不上就沿用 repo 現有版本，不會讓建置失敗。
      - name: 同步雲端族群
        run: python build_static.py --sync-groups --no-build

      - name: 回存新增的週資料與族群
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain static_data)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static_data
            git commit -m "資料更新：$(ls static_data/weekly | tail -1 | cut -d. -f1)"
            git push
          else
            echo "沒有新資料，略過 commit"
          fi

      - name: 建置頁面
        run: python build_static.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
